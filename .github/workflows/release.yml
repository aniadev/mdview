name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0). Required for manual runs.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: 'mdview ${{ steps.tag.outputs.value }}'
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the full release notes.
          draft: false
          prerelease: false

  build:
    needs: create-release
    name: Build (${{ matrix.platform }} / ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles appimage,deb

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build + upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseName: 'mdview ${{ needs.create-release.outputs.tag }}'
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the full release notes.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Sign and upload updater sig (macOS)
        if: matrix.target == 'universal-apple-darwin'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          mkdir -p /tmp/updater-sig
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "mdview_universal.app.tar.gz" \
            -D /tmp/updater-sig
          pnpm tauri signer sign /tmp/updater-sig/mdview_universal.app.tar.gz
          gh release upload "$TAG" \
            "/tmp/updater-sig/mdview_universal.app.tar.gz.sig" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Sign and upload updater sig (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          NSIS=$(gh release view "$TAG" \
            --repo "${{ github.repository }}" \
            --json assets \
            -q '[.assets[].name] | .[] | select(test("nsis\\.zip$"))' | head -1)
          if [ -z "$NSIS" ]; then echo "No NSIS asset found, skipping"; exit 0; fi
          mkdir -p /tmp/updater-sig
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "$NSIS" \
            -D /tmp/updater-sig
          pnpm tauri signer sign "/tmp/updater-sig/$NSIS"
          gh release upload "$TAG" \
            "/tmp/updater-sig/${NSIS}.sig" \
            --repo "${{ github.repository }}" \
            --clobber

  update-manifest:
    name: Update download/latest.json
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate download/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          NOTES=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body -q '.body // ""')
          ASSET_NAMES=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '[.assets[].name]')

          echo "Available assets:"
          echo "$ASSET_NAMES" | jq -r '.[]'

          get_name() { echo "$ASSET_NAMES" | jq -r --arg p "$1" '.[] | select(test($p))' | head -1; }

          PLATFORMS="{}"

          MAC_NAME=$(get_name 'universal\.app\.tar\.gz\.sig$')
          if [ -n "$MAC_NAME" ]; then
            MAC_SIG=$(curl -fsL "${BASE_URL}/${MAC_NAME}")
            PLATFORMS=$(jq -n \
              --arg u "${BASE_URL}/${MAC_NAME%.sig}" --arg s "$MAC_SIG" --argjson p "$PLATFORMS" \
              '$p + {"darwin-universal":{"signature":$s,"url":$u}}')
          else
            echo "WARNING: macOS .sig not found — skipping darwin-universal"
          fi

          WIN_NAME=$(get_name 'nsis\.zip\.sig$')
          if [ -n "$WIN_NAME" ]; then
            WIN_SIG=$(curl -fsL "${BASE_URL}/${WIN_NAME}")
            PLATFORMS=$(jq -n \
              --arg u "${BASE_URL}/${WIN_NAME%.sig}" --arg s "$WIN_SIG" --argjson p "$PLATFORMS" \
              '$p + {"windows-x86_64":{"signature":$s,"url":$u}}')
          else
            echo "WARNING: Windows .sig not found — skipping windows-x86_64"
          fi

          mkdir -p download
          jq -n \
            --arg v "$VERSION" \
            --arg n "$NOTES" \
            --arg d "$PUB_DATE" \
            --argjson pl "$PLATFORMS" \
            '{version:$v,notes:$n,pub_date:$d,platforms:$pl}' \
            > download/latest.json

          echo "Generated download/latest.json:"
          cat download/latest.json

      - name: Commit and push
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add download/latest.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update latest.json for ${TAG}"
          git push
