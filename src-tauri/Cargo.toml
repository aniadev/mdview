[package]
name = "mdview"
version = "1.8.0"
description = "Focused desktop editor for Markdown files inside a project folder. Tauri-based, dark+light themes, GFM + math + Mermaid."
authors = ["mdview"]
license = "MIT"
repository = "https://github.com/aniadev/mdview"
homepage = "https://github.com/aniadev/mdview"
keywords = ["markdown", "editor", "tauri", "gfm", "preview"]
categories = ["text-editors"]
edition = "2021"

[lib]
name = "mdview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
portable-pty = "0.8"
tauri-plugin-single-instance = "2"
regex = "1"
once_cell = "1"
